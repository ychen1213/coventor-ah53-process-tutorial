<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 670" role="img" aria-labelledby="t d"><title id="t">凸起 mark 的理想工艺截面示意</title><desc id="d">依次为硅基底、涂胶、条纹上留胶、周围刻蚀300纳米、去胶后凸起硅。</desc><style>text{font:18px 'Microsoft YaHei',sans-serif;fill:#24334a}.s{font-size:15px}.panel{fill:white;stroke:#dce3ee;stroke-width:2}.si{fill:#7fa6cc}.pr{fill:#df9a5b}.floor{stroke:#61718b;stroke-dasharray:6 5}</style><rect width="1060" height="670" rx="20" fill="#f6f8fc"/><text x="30" y="40" font-size="23" font-weight="700">凸起 Si · X–Z 截面 · 工艺示意（非测量曲线）</text><g transform="translate(30 70)"><rect class="panel" width="480" height="165" rx="12"/><text x="20" y="30">① Si 基底：厚 1 µm</text><rect class="si" x="30" y="83" width="410" height="60"/><text class="s" x="260" y="74">初始上表面 Z = +0.5 µm</text></g><g transform="translate(550 70)"><rect class="panel" width="480" height="165" rx="12"/><text x="20" y="30">② 顶部平坦化沉积 PR：0.5 µm</text><rect class="si" x="30" y="100" width="410" height="43"/><rect class="pr" x="30" y="65" width="410" height="35"/><text class="s" x="30" y="57">胶顶 Z ≈ +1.0 µm</text></g><g transform="translate(30 255)"><rect class="panel" width="480" height="165" rx="12"/><text x="20" y="30">③ AH53_KEEP + Light：图形外去胶</text><rect class="si" x="30" y="100" width="410" height="43"/><g class="pr"><rect x="100" y="65" width="45" height="35"/><rect x="215" y="65" width="45" height="35"/><rect x="330" y="65" width="45" height="35"/></g><text class="s" x="30" y="57">条纹上留胶；周围 Si 暴露</text></g><g transform="translate(550 255)"><rect class="panel" width="480" height="165" rx="12"/><text x="20" y="30">④ 刻蚀外围 Si：理想深度 0.3 µm</text><path class="si" d="M30 115H100V85H145V115H215V85H260V115H330V85H375V115H440V143H30Z"/><g class="pr"><rect x="100" y="50" width="45" height="35"/><rect x="215" y="50" width="45" height="35"/><rect x="330" y="50" width="45" height="35"/></g><text class="s" x="33" y="108">↓</text><text class="s" x="410" y="108">↓</text></g><g transform="translate(30 440)"><rect class="panel" width="1000" height="180" rx="12"/><text x="20" y="30">⑤ 去胶：只移除 Resist → Si mark 高于周围 300 nm</text><path class="si" d="M40 120H145V75H205V120H315V75H375V120H485V75H545V120H650V155H40Z"/><path class="floor" d="M40 75H680M40 120H680"/><text x="705" y="81">条顶 Z = +0.5 µm</text><text x="705" y="125">沟底 Z = +0.2 µm</text><text x="705" y="158" fill="#227269">高度差 = 0.3 µm</text></g><text x="30" y="653" class="s">非理想版在步骤③加入胶边噪声，在步骤④替换为 taper/loading + visibility + basic 三段刻蚀。</text></svg>
