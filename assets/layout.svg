<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="t d"><title id="t">单组 AH53 教学版图</title><desc id="d">模型范围 X16至32微米，Y负14至14微米。三条保护矩形宽1.6微米，长20微米，中心20.8、24、27.2微米。</desc><style>text{font:18px 'Microsoft YaHei',sans-serif;fill:#23334d}.small{font-size:15px}.axis{stroke:#8392a8;stroke-width:1}.dim{stroke:#227269;stroke-width:2;fill:none}</style><rect width="960" height="570" rx="20" fill="#f6f8fc"/><text x="40" y="42" font-weight="700">一组三条 · 所有坐标单位 µm · 示意图</text><rect x="260" y="75" width="320" height="420" fill="#fff" stroke="#b27b42" stroke-width="3" stroke-dasharray="9 6"/><g fill="#369b91"><rect x="340" y="135" width="32" height="300"/><rect x="404" y="135" width="32" height="300"/><rect x="468" y="135" width="32" height="300"/></g><g class="axis"><path d="M230 285H610M420 65V510" stroke-dasharray="3 6"/></g><text x="238" y="525">16</text><text x="563" y="525">32</text><text x="595" y="82">Y = +14</text><text x="595" y="501">Y = −14</text><text x="80" y="144">Y = +10</text><text x="80" y="435">Y = −10</text><text x="330" y="465" class="small">20.8</text><text x="407" y="465" class="small">24</text><text x="462" y="465" class="small">27.2</text><path class="dim" d="M340 114H372M340 108V120M372 108V120"/><text x="329" y="99" class="small">宽 1.6</text><path class="dim" d="M535 135V435M529 135H541M529 435H541"/><text x="550" y="255">长 20</text><g transform="translate(655 170)"><rect width="22" height="22" fill="#369b91"/><text x="34" y="17">AH53_KEEP</text><text x="34" y="47" class="small">GDS layer 1 / datatype 0</text><text x="34" y="76" class="small">条纹上留胶，保护 Si</text><rect y="116" width="22" height="22" fill="none" stroke="#b27b42" stroke-dasharray="5 3"/><text x="34" y="134">DOMAIN</text><text x="34" y="164" class="small">GDS layer 99 / datatype 0</text><text x="34" y="193" class="small">只限定模拟范围</text></g><text x="40" y="552" class="small">手动画三条即可；代码版保留四组 GDS 上下文，默认仅构建右侧这一组。X、Y 视觉比例不同。</text></svg>
